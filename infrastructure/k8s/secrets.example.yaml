# Template cho k8s/secrets.yaml
# KHÔNG commit secrets.yaml thật lên git!
# Hướng dẫn: cp k8s/secrets.example.yaml k8s/secrets.yaml
# Sau đó điền giá trị thật vào secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "your_postgres_user"
  POSTGRES_PASSWORD: "your_postgres_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: ecommerce
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "your_keycloak_admin_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ecommerce
type: Opaque
stringData:
  REDIS_PASSWORD: "your_redis_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-secret
  namespace: ecommerce
type: Opaque
stringData:
  STORAGE_ACCESS_KEY: "your_access_key"
  STORAGE_SECRET_KEY: "your_secret_key"
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secret
  namespace: ecommerce
type: Opaque
stringData:
  ELASTIC_PASSWORD: "your_elastic_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: mail-secret
  namespace: ecommerce
type: Opaque
stringData:
  MAIL_USERNAME: "your_email@gmail.com"
  MAIL_PASSWORD: "your_gmail_app_password"
